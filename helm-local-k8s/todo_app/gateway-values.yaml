gw:
  replicaCount: 1

  image:
    name: to-do-gw
    pullPolicy: Never
    tag: latest
  
  service:
    type: ClusterIP
    port: 80
    protocol: TCP
    targetPort: 80

  resources: {}

  livenessProbe:
    httpGet:
      path: /health
      port: 80
    initialDelaySeconds: 30
    periodSeconds: 120
    timeoutSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health
      port: 80
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3