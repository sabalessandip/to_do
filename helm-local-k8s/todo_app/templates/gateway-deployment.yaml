apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    app: three-tier-app-gw
spec:
  selector:
    matchLabels:
      app: three-tier-app-gw
  replicas: {{ .Values.gw.replicaCount }}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: three-tier-app-gw
    spec:
      containers:
      - name: three-tier-app-gateway
        image: "{{ .Values.gw.image.name }}:{{ .Values.gw.image.tag }}"
        imagePullPolicy: "{{ .Values.gw.image.pullPolicy }}"
{{- if .Values.gw.resources }}
        resources:
{{ toYaml .Values.gw.resources | indent 12 }}
{{- end }}
        livenessProbe:
{{ toYaml .Values.gw.livenessProbe | indent 12 }}
        readinessProbe:
{{ toYaml .Values.gw.readinessProbe | indent 12 }}
        env:
        - name: BACKEND_URL
          valueFrom:
            configMapKeyRef:
              name: three-tier-app-map
              key: backend-url
        - name: BASIC_AUTH_CREDENTIALS
          valueFrom:
            secretKeyRef:
              name: three-tier-app-secretes
              key: backend-auth-creds
        ports:
        - containerPort: 80
          name:  gateway-port
      restartPolicy: Always