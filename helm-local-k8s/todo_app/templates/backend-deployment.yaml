apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    app: three-tier-app-bk
spec:
  selector:
    matchLabels:
      app: three-tier-app-bk
  replicas: {{ .Values.bk.replicaCount }}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: three-tier-app-bk
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.35
        command:
          - sh
          - -c
          - |
            DB_HOST="db-service"
            DB_PORT="{{ .Values.db.service.port }}"
            echo "Waiting for ${DB_HOST}:${DB_PORT}"
            until nc -z ${DB_HOST} ${DB_PORT}; do
              echo "waiting for db..."
              sleep 2
            done
            echo "db is available"
      containers:
      - name: three-tier-app-backend
        image: "{{ .Values.bk.image.name }}:{{ .Values.bk.image.tag }}"
        imagePullPolicy: "{{ .Values.bk.image.pullPolicy }}"
{{- if .Values.bk.resources }}
        resources:
{{ toYaml .Values.bk.resources | indent 12 }}
{{- end }}
        livenessProbe:
{{ toYaml .Values.bk.livenessProbe | indent 12 }}
        readinessProbe:
{{ toYaml .Values.bk.readinessProbe | indent 12 }}
        env:
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: three-tier-app-map
              key: db-url
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: three-tier-app-map
              key: db-user
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: three-tier-app-secretes
              key: db-user-password
        ports:
        - containerPort: 5000
          name:  backend-port
      restartPolicy: Always